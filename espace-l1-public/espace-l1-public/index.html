<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Espace L1 Droit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: espace façon Notion — barre latérale vitrée, couverture « aurore » animée par page, tuile d'icône, contenu centré en colonnes souples */
:root{
  --bg:#fbfaf8; --paper:#ffffff; --side:#f4f2ee; --fg:#22201d; --muted:#7a766e; --faint:#a9a59c; --line:#e8e5df; --soft:#f3f1ed; --hover:#ebe8e2;
  --accent:#3b6fd8; --accent-soft:#e7eefc; --warn:#cf3f2e; --warn-soft:#fceae7; --ok:#2f8a57; --ok-soft:#e5f4eb; --amber:#b9770f; --amber-soft:#fbf0dc;
  --shadow:0 1px 2px rgba(34,32,29,.05),0 8px 24px -12px rgba(34,32,29,.18);
  --shadow-lg:0 2px 4px rgba(34,32,29,.06),0 22px 44px -18px rgba(34,32,29,.30);
  --grain:rgba(34,32,29,.08);
  --t-dc:#dfe8fb; --c-dc:#2f5bb0; --a-dc:#8fb0f0;
  --t-idp:#f9e2e7; --c-idp:#a83250; --a-idp:#f09ab0;
  --t-ihd:#f6ead3; --c-ihd:#8b5a0f; --a-ihd:#e9c27c;
  --t-met:#ece3f8; --c-met:#6b3ea5; --a-met:#c3a2ee;
  --t-ang:#e1f2e8; --c-ang:#2a7550; --a-ang:#8fd3ad;
  --t-ri:#dff1f4; --c-ri:#1d6c7b; --a-ri:#86cfdb;
  --t-eco:#fbebdb; --c-eco:#a2561a; --a-eco:#f2b27d;
  --t-gen:#eceae5; --c-gen:#5b5851; --a-gen:#c9c4b8;
  --t-live:#efe2f8; --c-live:#7a2ea3; --a-live:#d39ff0;
  --t-out:#fde5da; --c-out:#b4461b; --a-out:#f6a07a;
  --t-lib:#e9e4dc; --c-lib:#6a4a2a; --a-lib:#cdb08a;
  --f-title:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171615; --paper:#1f1e1c; --side:#1c1b19; --fg:#ece9e3; --muted:#a29e95; --faint:#6f6b64; --line:#2e2c29; --soft:#252321; --hover:#2d2b28;
  --accent:#7aa6f6; --accent-soft:#1e2a40; --warn:#f2806e; --warn-soft:#3b2421; --ok:#6fcb98; --ok-soft:#1d3327; --amber:#ebb35a; --amber-soft:#3a2e1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 22px 44px -18px rgba(0,0,0,.75); --grain:rgba(255,255,255,.06);
  --t-dc:#1f2b45; --c-dc:#a3c0f5; --a-dc:#3b5fa8; --t-idp:#3d2129; --c-idp:#f3a8b9; --a-idp:#9b3654; --t-ihd:#3a2e1b; --c-ihd:#ecc888; --a-ihd:#8c6418;
  --t-met:#2e2441; --c-met:#cdb0f2; --a-met:#6b45a8; --t-ang:#1c3428; --c-ang:#95d8b2; --a-ang:#2f7a55; --t-ri:#1a3238; --c-ri:#8fd6e2; --a-ri:#25707f;
  --t-eco:#3b2a1b; --c-eco:#f3ba88; --a-eco:#9c5a22; --t-gen:#2b2a27; --c-gen:#c4bfb5; --a-gen:#57534c; --t-live:#33213f; --c-live:#dcaef3; --a-live:#7d36a6;
  --t-out:#3d2519; --c-out:#f6aa88; --a-out:#a94b22; --t-lib:#33291f; --c-lib:#dcc19c; --a-lib:#7a5a36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171615; --paper:#1f1e1c; --side:#1c1b19; --fg:#ece9e3; --muted:#a29e95; --faint:#6f6b64; --line:#2e2c29; --soft:#252321; --hover:#2d2b28;
  --accent:#7aa6f6; --accent-soft:#1e2a40; --warn:#f2806e; --warn-soft:#3b2421; --ok:#6fcb98; --ok-soft:#1d3327; --amber:#ebb35a; --amber-soft:#3a2e1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 22px 44px -18px rgba(0,0,0,.75); --grain:rgba(255,255,255,.06);
  --t-dc:#1f2b45; --c-dc:#a3c0f5; --a-dc:#3b5fa8; --t-idp:#3d2129; --c-idp:#f3a8b9; --a-idp:#9b3654; --t-ihd:#3a2e1b; --c-ihd:#ecc888; --a-ihd:#8c6418;
  --t-met:#2e2441; --c-met:#cdb0f2; --a-met:#6b45a8; --t-ang:#1c3428; --c-ang:#95d8b2; --a-ang:#2f7a55; --t-ri:#1a3238; --c-ri:#8fd6e2; --a-ri:#25707f;
  --t-eco:#3b2a1b; --c-eco:#f3ba88; --a-eco:#9c5a22; --t-gen:#2b2a27; --c-gen:#c4bfb5; --a-gen:#57534c; --t-live:#33213f; --c-live:#dcaef3; --a-live:#7d36a6;
  --t-out:#3d2519; --c-out:#f6aa88; --a-out:#a94b22; --t-lib:#33291f; --c-lib:#dcc19c; --a-lib:#7a5a36; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}

/* ---------- barre latérale ---------- */
aside{background:var(--side);border-right:1px solid var(--line);padding-block:16px 14px;padding-inline:10px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ws{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.ws .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-title);font-weight:600;font-size:.95rem;color:#fff;background:conic-gradient(from 200deg,var(--a-dc),var(--a-idp),var(--a-ihd),var(--a-ang),var(--a-dc));box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.ws b{display:block;font-size:.93rem;line-height:1.2}
.ws small{display:block;font-size:.72rem;color:var(--muted)}
.nav-label{font-size:.7rem;font-weight:600;color:var(--faint);padding:14px 10px 4px;letter-spacing:.06em;text-transform:uppercase}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--fg);font-size:.9rem;width:100%;transition:background .12s}
.nav:hover{background:var(--hover)}
.nav[aria-current="page"]{background:var(--paper);box-shadow:var(--shadow);font-weight:600}
.nav .ico{width:20px;text-align:center;flex:none;font-size:.95rem}
.nav .count{margin-left:auto;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--hover);border-radius:99px;padding:0 7px;line-height:1.6}
.nav .dot{width:9px;height:9px;border-radius:3px;background:var(--a);flex:none;margin-inline:5px}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.side-foot i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.side-foot.on i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.menu-btn{display:none}

/* ---------- couverture ---------- */
main{min-width:0;padding-inline:clamp(16px,6vw,96px);padding-block:0 110px}
.cover{height:clamp(140px,24vh,220px);margin-inline:calc(-1*clamp(16px,6vw,96px));position:relative;overflow:hidden;background:var(--t1)}
.cover .blob{position:absolute;border-radius:50%;filter:blur(48px);opacity:.85}
.cover .b1{width:60%;height:160%;left:-10%;top:-40%;background:var(--a1);animation:drift1 22s ease-in-out infinite alternate}
.cover .b2{width:50%;height:150%;right:-8%;top:-20%;background:var(--a2);animation:drift2 26s ease-in-out infinite alternate}
.cover .b3{width:35%;height:120%;left:38%;top:30%;background:var(--t2);animation:drift1 30s ease-in-out infinite alternate-reverse}
.cover::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--grain) 1px,transparent 1.2px);background-size:16px 16px}
.cover .lbl{position:absolute;right:clamp(16px,6vw,96px);bottom:14px;z-index:2;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c1);background:color-mix(in srgb,var(--paper) 70%,transparent);backdrop-filter:blur(6px);padding:4px 9px;border-radius:99px}
@keyframes drift1{to{transform:translate(12%,8%) scale(1.08)}}
@keyframes drift2{to{transform:translate(-10%,10%) scale(1.12)}}

/* ---------- page ---------- */
.page{max-width:940px;margin:0 auto;display:grid;gap:30px}
.page-head{display:grid;gap:10px}
.icon-tile{width:84px;height:84px;margin-top:-46px;position:relative;z-index:3;border-radius:22px;background:var(--paper);box-shadow:var(--shadow-lg);display:grid;place-items:center;font-size:2.7rem}
.crumb{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:-6px}
.crumb button{all:unset;cursor:pointer;color:var(--muted)}
.crumb button:hover{color:var(--fg);text-decoration:underline}
h1{font-family:var(--f-title);font-weight:500;font-size:clamp(2.3rem,5.4vw,3.3rem);line-height:1.05;margin:0;letter-spacing:-.015em;text-wrap:balance}
h1 em{font-style:italic;color:var(--muted);font-weight:400}
h2{font-family:var(--f-title);font-size:1.45rem;font-weight:500;margin:0;letter-spacing:-.005em;text-wrap:balance}
h3{font-size:.98rem;font-weight:600;margin:0}
.sub{color:var(--muted);margin:0;max-width:66ch;font-size:.98rem}
section{display:grid;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head .more{all:unset;cursor:pointer;font-size:.82rem;color:var(--muted)}
.sec-head .more:hover{color:var(--accent)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px 10px}
.empty{color:var(--muted);font-size:.88rem;padding:14px 6px}

/* ---------- hero accueil ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.datebox{width:86px;border-radius:16px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);text-align:center;border:1px solid var(--line)}
.datebox span{display:block;background:var(--warn);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 0}
.datebox b{display:block;font-family:var(--f-title);font-size:2.4rem;font-weight:500;line-height:1.15;padding:4px 0 6px}
.next{border-radius:18px;padding:18px 20px;background:linear-gradient(135deg,var(--t1),color-mix(in srgb,var(--t2) 60%,var(--paper)));border:1px solid color-mix(in srgb,var(--c1) 18%,transparent);display:grid;gap:6px;position:relative;overflow:hidden}
.next .k{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c1)}
.next h3{font-family:var(--f-title);font-size:1.5rem;font-weight:500}
.next .big{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-family:var(--f-title);font-size:3.4rem;line-height:1;color:var(--c1);opacity:.9;text-align:right}
.next .big small{display:block;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.next .txt{max-width:calc(100% - 130px);display:grid;gap:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{all:unset;box-sizing:border-box;cursor:pointer;border-radius:16px;padding:16px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:2px;transition:transform .18s,box-shadow .18s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--t);margin-bottom:8px;font-size:1.05rem}
.stat b{font-family:var(--f-title);font-size:2rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.mini-bar{height:5px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.mini-bar i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* ---------- lignes ---------- */
.row{display:grid;grid-template-columns:22px 108px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-radius:10px;transition:background .12s}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--soft)}
.row .t{min-width:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .t .ti{font-weight:500}
.row .t small{flex-basis:100%;color:var(--muted);font-size:.8rem;line-height:1.35}
.row.done .t{opacity:.45}
.row.done .ti{text-decoration:line-through}
.row .acts{display:flex;gap:6px;align-items:center}
.when{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.4}
.when b{display:block;color:var(--fg);font-weight:500}
.cb{appearance:none;width:18px;height:18px;border:1.5px solid var(--faint);border-radius:6px;cursor:pointer;display:grid;place-items:center;margin:0;transition:all .15s;background:var(--paper)}
.cb:checked{background:var(--ok);border-color:var(--ok)}
.cb:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.x{all:unset;cursor:pointer;color:var(--muted);font-size:.78rem;padding:2px 6px;border-radius:5px;opacity:0;transition:opacity .12s}
.row:hover .x,.x:focus-visible,tr:hover .x{opacity:1}
.x:hover{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;padding:1px 8px;border-radius:6px;background:var(--t);color:var(--c);white-space:nowrap;font-weight:600;line-height:1.7}
.tag::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c);opacity:.7}
.pill{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.mid{background:var(--amber-soft);color:var(--amber)}
.pill.far{background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.week-label{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:20px 8px 6px;display:flex;gap:10px;align-items:center}
.week-label::after{content:"";flex:1;height:1px;background:var(--line)}
.callout{display:grid;grid-template-columns:auto 1fr;gap:12px;border-radius:14px;padding:14px 16px;background:var(--soft);font-size:.9rem;border:1px solid var(--line)}
.callout div{min-width:0}

/* ---------- cartes ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.card{all:unset;box-sizing:border-box;border-radius:18px;overflow:hidden;cursor:pointer;display:grid;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card .cv{height:92px;position:relative;overflow:hidden;background:var(--t)}
.card .cv::before{content:"";position:absolute;width:70%;height:180%;right:-20%;top:-60%;border-radius:50%;background:var(--a);filter:blur(26px);opacity:.9}
.card .cv::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--grain) 1px,transparent 1.2px);background-size:12px 12px}
.card .ct{position:absolute;left:16px;bottom:-22px;width:50px;height:50px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;font-size:1.6rem;z-index:2}
.card .bd{padding:30px 16px 16px;display:grid;gap:6px}
.card h3{font-family:var(--f-title);font-size:1.22rem;font-weight:500;line-height:1.2}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.card .meta span{font-size:.72rem;background:var(--soft);border-radius:6px;padding:1px 7px;color:var(--muted);font-weight:500}
.card .nx{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.sortie{cursor:default}
.sortie .cv{height:70px}
.sortie .bd{padding-top:16px}

/* ---------- documents ---------- */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.file{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--paper);border:1px solid var(--line);text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
.file:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
.file .pdf{width:40px;height:48px;border-radius:6px 12px 6px 6px;background:linear-gradient(160deg,var(--t),color-mix(in srgb,var(--a) 55%,var(--t)));display:grid;place-items:end center;padding-bottom:5px;font-family:var(--f-mono);font-size:.55rem;font-weight:500;color:var(--c);letter-spacing:.06em;position:relative}
.file .pdf::before{content:"";position:absolute;top:0;right:0;width:12px;height:12px;background:var(--paper);border-bottom-left-radius:5px;opacity:.7}
.file b{display:block;font-weight:600;font-size:.88rem;line-height:1.3;overflow-wrap:anywhere}
.file small{color:var(--muted);font-size:.74rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:.8rem;padding:4px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--paper);transition:all .12s}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);max-width:420px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:.9rem}

/* ---------- bibliothèque ---------- */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:16px}
.book{border-radius:6px 16px 16px 6px;background:linear-gradient(105deg,color-mix(in srgb,var(--c) 85%,#000) 0 10px,var(--c) 10px);color:#fff;padding:18px 16px 14px 24px;min-height:190px;display:grid;align-content:space-between;gap:12px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;transition:transform .18s}
.book:hover{transform:translateY(-4px) rotate(-.6deg)}
.book::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none}
.book .ed{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.book h3{font-family:var(--f-title);font-size:1.4rem;font-weight:500;line-height:1.1}
.book .lk{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.book .lk a{font-size:.74rem;font-weight:600;text-decoration:none;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:3px 9px;border-radius:99px;color:#fff}
.book .lk a:hover{background:rgba(255,255,255,.32)}
.b-civ{--c:#9c2f3a}.b-pen{--c:#23446e}.b-cpc{--c:#7b4b1e}.b-cpp{--c:#3c5a3a}.b-coj{--c:#5a3d6e}.b-cjpm{--c:#2d6670}.b-com{--c:#6b6b2a}.b-trav{--c:#7a3a5a}.b-const{--c:#1f3c73}.b-ddhc{--c:#8a6a1c}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px}
.art{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.art b{font-family:var(--f-mono);font-size:.76rem;color:var(--c,var(--accent));font-weight:500}
.art span{font-size:.86rem}
.reader{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);box-shadow:var(--shadow);font-family:var(--f-title);font-size:1.08rem;line-height:1.7;max-height:560px;overflow:auto}
.reader h3{font-family:var(--f-title);font-size:1rem;font-weight:600;font-style:italic;margin:18px 0 2px;color:var(--c-lib)}
.reader p{margin:0;max-width:62ch}
.reader .pre{font-style:italic;color:var(--muted)}

/* ---------- tableaux ---------- */
.tbl{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:660px;font-size:.9rem}
th{font-size:.72rem;font-weight:600;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--soft)}
select.status{appearance:none;border:0;border-radius:99px;padding:3px 12px;font-size:.76rem;font-weight:700;cursor:pointer}
select.status[data-v="À faire"]{background:var(--soft);color:var(--fg)}
select.status[data-v="En cours"]{background:var(--amber-soft);color:var(--amber)}
select.status[data-v="Rendu"]{background:var(--ok-soft);color:var(--ok)}

/* ---------- semaine type ---------- */
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:6px;align-content:start;min-width:0;box-shadow:var(--shadow)}
.wday h3{font-family:var(--f-title);font-size:1.02rem;font-weight:500;display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.wday h3 span{font-family:var(--f-ui);font-size:.66rem;color:var(--muted);font-weight:500}
.blk{background:var(--t);border-radius:8px;padding:6px 8px;font-size:.76rem;line-height:1.3;position:relative}
.blk b{display:block;font-family:var(--f-mono);font-weight:500;font-size:.64rem;color:var(--c);margin-bottom:1px}

/* ---------- propriétés / formulaires ---------- */
.props{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;font-size:.9rem;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.props dt{color:var(--muted);display:flex;gap:6px;align-items:center}
.props dd{margin:0;min-width:0}
ul.plain{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.plain li{display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:.92rem}
ul.plain li::before{content:"→";color:var(--c,var(--accent));font-weight:600}
.add{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px}
.add input,.add select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 10px;font-size:.86rem;min-width:0}
.add input[type=text]{flex:1 1 200px}
.btn{all:unset;cursor:pointer;font-size:.84rem;padding:6px 14px;border-radius:9px;background:var(--fg);color:var(--bg);font-weight:600}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.ghost-add{all:unset;cursor:pointer;color:var(--muted);font-size:.86rem;padding:8px;border-radius:8px}
.ghost-add:hover{color:var(--fg);background:var(--soft)}
.status-line{font-size:.78rem;color:var(--muted)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.84rem;z-index:30;box-shadow:var(--shadow-lg)}
.ext{font-size:.85rem;color:var(--accent);text-decoration:none}
.ext:hover{text-decoration:underline}

@media (max-width:1000px){.week-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:780px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:25;transform:translateX(-102%);transition:transform .22s;height:100%;padding-top:calc(16px + env(safe-area-inset-top,0px));box-shadow:var(--shadow-lg)}
  aside.open{transform:none}
  .menu-btn{all:unset;display:grid;place-items:center;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:20;width:38px;height:38px;border-radius:12px;background:var(--paper);box-shadow:var(--shadow-lg);cursor:pointer;text-align:center;line-height:38px;font-size:1.1rem}
  .row{grid-template-columns:22px minmax(0,1fr) auto}
  .row .when{grid-column:2;grid-row:1}
  .row .t{grid-column:2;grid-row:2}
  .row .acts{grid-column:3;grid-row:1/3}
  .props{grid-template-columns:1fr;gap:2px 0}
  .props dd{margin-bottom:8px}
  .week-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .next .big{position:static;transform:none;text-align:left;font-size:2.4rem}
  .next .txt{max-width:none}
}
@media (max-width:440px){.week-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.cover .blob{animation:none}.card,.stat,.file,.book,aside{transition:none}.card:hover,.stat:hover,.file:hover,.book:hover{transform:none}}
</style>

const DDHC_PRE="Les représentants du peuple français, constitués en Assemblée nationale, considérant que l'ignorance, l'oubli ou le mépris des droits de l'homme sont les seules causes des malheurs publics et de la corruption des gouvernements, ont résolu d'exposer, dans une déclaration solennelle, les droits naturels, inaliénables et sacrés de l'homme, afin que cette déclaration, constamment présente à tous les membres du corps social, leur rappelle sans cesse leurs droits et leurs devoirs ; afin que les actes du pouvoir législatif, et ceux du pouvoir exécutif, pouvant être à chaque instant comparés avec le but de toute institution politique, en soient plus respectés ; afin que les réclamations des citoyens, fondées désormais sur des principes simples et incontestables, tournent toujours au maintien de la Constitution et au bonheur de tous. En conséquence, l'Assemblée nationale reconnaît et déclare, en présence et sous les auspices de l'Être suprême, les droits suivants de l'homme et du citoyen.";
const DDHC=["Les hommes naissent et demeurent libres et égaux en droits. Les distinctions sociales ne peuvent être fondées que sur l'utilité commune.","Le but de toute association politique est la conservation des droits naturels et imprescriptibles de l'homme. Ces droits sont la liberté, la propriété, la sûreté, et la résistance à l'oppression.","Le principe de toute souveraineté réside essentiellement dans la nation. Nul corps, nul individu ne peut exercer d'autorité qui n'en émane expressément.","La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui : ainsi, l'exercice des droits naturels de chaque homme n'a de bornes que celles qui assurent aux autres membres de la société la jouissance de ces mêmes droits. Ces bornes ne peuvent être déterminées que par la loi.","La loi n'a le droit de défendre que les actions nuisibles à la société. Tout ce qui n'est pas défendu par la loi ne peut être empêché, et nul ne peut être contraint à faire ce qu'elle n'ordonne pas.","La loi est l'expression de la volonté générale. Tous les citoyens ont droit de concourir personnellement, ou par leurs représentants, à sa formation. Elle doit être la même pour tous, soit qu'elle protège, soit qu'elle punisse. Tous les citoyens étant égaux à ses yeux sont également admissibles à toutes dignités, places et emplois publics, selon leur capacité, et sans autre distinction que celle de leurs vertus et de leurs talents.","Nul homme ne peut être accusé, arrêté ni détenu que dans les cas déterminés par la loi, et selon les formes qu'elle a prescrites. Ceux qui sollicitent, expédient, exécutent ou font exécuter des ordres arbitraires, doivent être punis ; mais tout citoyen appelé ou saisi en vertu de la loi doit obéir à l'instant : il se rend coupable par la résistance.","La loi ne doit établir que des peines strictement et évidemment nécessaires, et nul ne peut être puni qu'en vertu d'une loi établie et promulguée antérieurement au délit, et légalement appliquée.","Tout homme étant présumé innocent jusqu'à ce qu'il ait été déclaré coupable, s'il est jugé indispensable de l'arrêter, toute rigueur qui ne serait pas nécessaire pour s'assurer de sa personne doit être sévèrement réprimée par la loi.","Nul ne doit être inquiété pour ses opinions, même religieuses, pourvu que leur manifestation ne trouble pas l'ordre public établi par la loi.","La libre communication des pensées et des opinions est un des droits les plus précieux de l'homme : tout citoyen peut donc parler, écrire, imprimer librement, sauf à répondre de l'abus de cette liberté dans les cas déterminés par la loi.","La garantie des droits de l'homme et du citoyen nécessite une force publique : cette force est donc instituée pour l'avantage de tous, et non pour l'utilité particulière de ceux auxquels elle est confiée.","Pour l'entretien de la force publique, et pour les dépenses d'administration, une contribution commune est indispensable : elle doit être également répartie entre tous les citoyens, en raison de leurs facultés.","Tous les citoyens ont le droit de constater, par eux-mêmes ou par leurs représentants, la nécessité de la contribution publique, de la consentir librement, d'en suivre l'emploi, et d'en déterminer la quotité, l'assiette, le recouvrement et la durée.","La société a le droit de demander compte à tout agent public de son administration.","Toute société dans laquelle la garantie des droits n'est pas assurée, ni la séparation des pouvoirs déterminée, n'a point de Constitution.","La propriété étant un droit inviolable et sacré, nul ne peut en être privé, si ce n'est lorsque la nécessité publique, légalement constatée, l'exige évidemment, et sous la condition d'une juste et préalable indemnité."];

const KEY="espaceL1-donnees";
function loadLocal(){let o={upd:{},del:[],add:[]};try{o=Object.assign(o,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}return o}
let LOCAL=loadLocal();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(LOCAL));return true}catch(e){toast("Ton navigateur bloque l'enregistrement : les changements seront perdus en fermant la page");return false}}
function rebuild(){items=SEED.filter(i=>!LOCAL.del.includes(i.id)).map(i=>Object.assign({},i,LOCAL.upd[i.id]||{})).concat(LOCAL.add.filter(i=>!LOCAL.del.includes(i.id)).map(i=>Object.assign({},i,LOCAL.upd[i.id]||{})));ready=true}
async function upd(id,patch){LOCAL.upd[id]=Object.assign(LOCAL.upd[id]||{},patch);saveLocal();rebuild();render()}
async function del(id){LOCAL.del.push(id);saveLocal();rebuild();render();toast("Supprimé")}
async function addItem(d){d.id="perso-"+Date.now().toString(36);LOCAL.add.push(d);saveLocal();rebuild();render();toast("Ajouté")}

/* ---------- blocs réutilisables ---------- */
function eventRow(it){
  const n=it.date?daysTo(it.date):null;const chk=it.kind!=="seance";
  return `<div class="row ${it.done?"done":""}">
   ${chk?`<input type="checkbox" class="cb" data-done="${it.id}" ${it.done?"checked":""} aria-label="Fait">`:`<span></span>`}
   <span class="when"><b>${it.date?fmtDay(it.date):"—"}</b>${esc(timeStr(it))}</span>
   <div class="t">${kindTag(it)}<span class="ti">${esc(it.title)}</span>${it.note?`<small>${esc(it.note)}</small>`:""}</div>
   <div class="acts">${chk&&n!==null&&!it.done&&it.status!=="Rendu"?due(n):""}<button class="x" data-del="${it.id}" aria-label="Supprimer">✕</button></div></div>`}
function todoRow(i){return `<div class="row ${i.done?"done":""}" style="grid-template-columns:22px minmax(0,1fr) auto">
  <input type="checkbox" class="cb" data-done="${i.id}" ${i.done?"checked":""} aria-label="Fait">
  <div class="t">${i.subj&&i.subj!=="gen"?tagOf(i.subj):""}<span class="ti">${esc(i.title)}</span>${i.note?`<small>${esc(i.note)}</small>`:""}</div>
  <div class="acts">${i.date&&!i.done?due(daysTo(i.date)):""}<button class="x" data-del="${i.id}" aria-label="Supprimer">✕</button></div></div>`}
const fileTile=f=>`<a class="file" href="${f[3]}" target="_blank" rel="noopener" style="${vars(sv(f[0]))}"><span class="pdf">IED</span><span><b>${esc(f[1])}</b><small>${esc((S[f[0]]||S.gen).short)} · ${sizeStr(f[4])}</small></span></a>`;
const bookCard=b=>`<div class="book ${b.cls}"><div><div class="ed">${esc(b.ed)}</div><h3>${esc(b.n)}</h3></div><div class="lk">${b.pdf?`<a href="${b.pdf}" target="_blank" rel="noopener">PDF à jour</a>`:""}${b.lgf?`<a href="${b.lgf}" target="_blank" rel="noopener">Légifrance</a>`:""}${(b.links||[]).map(([t,u])=>u[0]==="#"?`<a href="#" data-scroll="${u.slice(1)}">${esc(t)}</a>`:`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join("")}</div></div>`;
const upcoming=f=>items.filter(i=>i.date&&daysTo(i.date)>=0&&(!f||f(i))).sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
const loading=t=>`<div class="empty">${ready?t:"Chargement de tes données…"}</div>`;

const P={};
P.accueil=()=>{
  const t=todayISO(),d=dOf(t),h=new Date().getHours();
  const week=upcoming(i=>daysTo(i.date)<=7&&i.kind!=="todo");
  const dev=items.filter(i=>i.kind==="devoir"&&i.status!=="Rendu"&&i.date).sort((a,b)=>a.date.localeCompare(b.date));
  const nx=dev[0];const allT=items.filter(i=>i.kind==="todo"),todos=allT.filter(i=>!i.done);
  const pct=allT.length?Math.round(100*(allT.length-todos.length)/allT.length):0;
  const k=nx?sv(nx.subj):"dc";
  return `${head("🏠",`${h<5||h>=18?"Bonsoir":"Bonjour"} <em>et bon courage</em>`)}
  <div class="hero"><div class="datebox"><span>${d.toLocaleDateString("fr-FR",{month:"short"}).replace(".","")}</span><b>${d.getDate()}</b></div>
   <div><div style="font-weight:600;text-transform:capitalize">${d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</div><div class="status-line">Licence 1 Droit · IED Paris 1 · semestre 1</div></div></div>
  ${nx?`<div class="next" style="--t1:var(--t-${k});--t2:var(--a-${k});--c1:var(--c-${k})"><div class="txt"><span class="k">Prochaine échéance · ${esc((S[nx.subj]||S.gen).n)}</span><h3>${esc(nx.title)}</h3><span class="status-line">${fmtDay(nx.date)}${nx.start?" · avant "+esc(nx.start):""}${nx.note?" · "+esc(nx.note):""}</span></div><div class="big">${daysTo(nx.date)<=0?"!":"J-"+daysTo(nx.date)}<small>${daysTo(nx.date)<=0?"aujourd'hui":"jours restants"}</small></div></div>`:""}
  <div class="stats">
   <button class="stat" data-go="devoirs" style="${vars("idp")}"><span class="ic">📝</span><b>${ready?dev.length:"–"}</b><span>devoirs à rendre</span></button>
   <button class="stat" data-go="planning" style="${vars("dc")}"><span class="ic">🎥</span><b>${ready?upcoming(i=>i.kind==="seance"&&daysTo(i.date)<=7).length:"–"}</b><span>séances sur 7 jours</span></button>
   <button class="stat" data-go="todo" style="${vars("ang")}"><span class="ic">✅</span><b>${ready?todos.length:"–"}</b><span>choses à demander</span><span class="mini-bar"><i style="width:${pct}%"></i></span></button>
   <button class="stat" data-go="documents" style="${vars("ihd")}"><span class="ic">📂</span><b>${FILES.length}</b><span>documents de cours</span></button>
  </div>

   <div class="panel">${week.length?week.map(eventRow).join(""):loading("Rien de prévu cette semaine.")}</div></section>
  <section><div class="sec-head"><h2>À demander en priorité</h2><button class="more" data-go="todo">Toute la liste →</button></div>
   <div class="panel">${todos.slice(0,4).map(todoRow).join("")||loading("Tout est demandé. 👏")}</div></section>
  <section><div class="sec-head"><h2>Tes matières</h2><button class="more" data-go="cours">Voir tout →</button></div><div class="cards">${SUBJ_ORDER.slice(0,4).map(subjCard).join("")}</div></section>`};

P.planning=()=>{
  const F=[["tout","Tout"],["seance","Cours en direct"],["devoir","Devoirs"],["admin","Dates limites"],["sortie","Sorties"]];
  const list=items.filter(i=>i.kind!=="todo"&&i.date&&(state.filter==="tout"||i.kind===state.filter)&&(state.showPast||daysTo(i.date)>=0)).sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
  let out="",wk="";for(const i of list){const k=weekKey(i.date);if(k!==wk){if(wk)out+="</div>";wk=k;const e=new Date(dOf(k).getTime()+6*864e5).toISOString().slice(0,10);out+=`<div class="week-label">${dOf(k).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})} → ${dOf(e).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</div><div class="panel">`}out+=eventRow(i)}if(wk)out+="</div>";
  return `${head("📅","Planning","Regroupements, permanences, dépôts et sorties, du plus proche au plus lointain. Tes streams sont dans la semaine type.")}
  <div class="chips">${F.map(([v,l])=>`<button class="chip" data-filter="${v}" aria-pressed="${state.filter===v}">${l}</button>`).join("")}<button class="chip" data-past aria-pressed="${state.showPast}">Afficher le passé</button></div>
  ${addForm("event")}<div>${out||loading("Rien à afficher avec ce filtre.")}</div>`};

  return `${head("📝","Devoirs",`Tous les dépôts du semestre, en PDF sur la plateforme. Vise avant ton stream de 20h30. ${ready?`${done} sur ${dev.length} fait${done>1?"s":""}.`:""}`)}
  <div class="tbl"><table><thead><tr><th>Statut</th><th>Devoir</th><th>Matière</th><th>Échéance</th><th></th><th></th></tr></thead><tbody>
  ${dev.map(i=>{const st=i.kind==="admin"?(i.done?"Rendu":"À faire"):(i.status||"À faire");const sujet=FILES.find(f=>f[0]===i.subj&&f[2]==="Devoir"&&f[1].startsWith(i.title.replace("n°","")));return `<tr>
   <td><select class="status" data-status="${i.id}" data-kind="${i.kind}" data-v="${st}" aria-label="Statut">${(i.kind==="admin"?["À faire","Rendu"]:["À faire","En cours","Rendu"]).map(o=>`<option value="${o}" ${o===st?"selected":""}>${o==="Rendu"&&i.kind==="admin"?"Fait":o}</option>`).join("")}</select></td>
   <td><strong>${esc(i.title)}</strong>${i.note?`<br><span class="status-line">${esc(i.note)}</span>`:""}${sujet?`<br><a class="ext" href="${sujet[3]}" target="_blank" rel="noopener">Ouvrir le sujet →</a>`:""}</td>
   <td>${tagOf(i.subj)}</td><td class="when"><b>${i.date?fmtDay(i.date):"à fixer"}</b>${esc(i.start||"")}</td>
   <td>${st!=="Rendu"&&i.date?due(daysTo(i.date)):st==="Rendu"?`<span class="pill ok">✓ fait</span>`:""}</td>
   <td><button class="x" data-del="${i.id}" aria-label="Supprimer">✕</button></td></tr>`}).join("")||`<tr><td colspan="6">${loading("Aucun devoir.")}</td></tr>`}
  </tbody></table></div>${addForm("devoir")}`};

P.todo=()=>{
  const all=items.filter(i=>i.kind==="todo"),done=all.filter(i=>i.done).length,pct=all.length?Math.round(100*done/all.length):0;
  return `${head("✅","To-do",`Ce qu'il te reste à demander, et à qui. ${all.length?`${done} sur ${all.length} fait${done>1?"s":""}.`:""}`)}
  ${all.length?`<div class="mini-bar" style="height:8px;max-width:460px"><i style="width:${pct}%"></i></div>`:""}
  ${TODO_GROUPS.map(([g,ic,l])=>{const L=all.filter(i=>(i.group||"perso")===g).sort((a,b)=>(a.done-b.done)||((a.order||0)-(b.order||0)));return `<section><div class="sec-head"><h2>${ic} ${l}</h2><span class="status-line">${L.filter(i=>!i.done).length} à faire</span></div>
   <div class="panel">${L.map(todoRow).join("")}<form class="add" data-addtodo="${g}"><input type="text" id="todo-${g}" placeholder="+ Ajouter une tâche…" aria-label="Nouvelle tâche : ${l}" required><button class="btn ghost" type="submit">Ajouter</button></form></div></section>`}).join("")}`};

P.sorties=()=>{
  const L=items.filter(i=>i.kind==="sortie").sort((a,b)=>a.date.localeCompare(b.date));
  return `${head("🎉","Sorties","Pop-ups, events et restos, placés sur tes créneaux libres. Vérifie les horaires avant d'y aller.")}
  <div class="cards">${L.map(i=>`<div class="card sortie" style="${vars(i.title.match(/Resto|Vinaio/)?"eco":"out")};${i.done?"opacity:.55":""}"><div class="cv"></div><div class="bd"><span class="when"><b>${fmtDay(i.date)}</b>${esc(timeStr(i))}</span><h3>${esc(i.title)}</h3><span class="status-line">${esc(i.note||"")}</span>
   <label class="status-line" style="display:flex;gap:8px;align-items:center;margin-top:6px;cursor:pointer"><input type="checkbox" class="cb" data-done="${i.id}" ${i.done?"checked":""}> J'y suis allé</label></div></div>`).join("")||loading("Aucune sortie prévue.")}</div>
  ${addForm("sortie")}`};

P.semaine=()=>`${head("🗓️","Semaine type","Calée sur tes streams : réveil vers 11h, travail l'après-midi, jeudi matin pour bosser au calme, samedi libre.")}
  <div class="week-grid">${WEEK.map(([d,s,b])=>`<div class="wday"><h3>${d}<span>${s}</span></h3>${b.map(([h,t,k])=>`<div class="blk" style="${vars(k)}"><b>${h}</b>${esc(t)}</div>`).join("")}</div>`).join("")}</div>
  <div class="callout"><span>💡</span><div>Quand un cours finit tard (permanences de constit' jusqu'à 21h30), lance le stream vers 21h45. Les permanences de 9h ou 10h après un stream sont facultatives : les replays et les mails de questions suffisent.</div></div>`;

P.documents=()=>{
  const q=state.q.trim().toLowerCase();
  const L=FILES.filter(f=>(state.docSubj==="tout"||f[0]===state.docSubj)&&(!q||f[1].toLowerCase().includes(q)));
  const opts=[["tout","Tout"],...SUBJ_ORDER.map(k=>[k,S[k].short]),["gen","Admin"]];
  const ord=f=>{const i=SUBJ_ORDER.indexOf(f[0]);return i<0?99:i};
  const groups=CAT_ORDER.map(c=>[c,L.filter(f=>f[2]===c).sort((a,b)=>ord(a)-ord(b))]).filter(g=>g[1].length);
  return `${head("📂","Documents",`Tous tes cours, documents de travail, transcriptions, bulletins et sujets : ${FILES.length} PDF. Les PDF restent sur la plateforme IED : clique pour ouvrir le cours.`)}
  <div class="search"><span>🔎</span><input type="text" id="doc-q" placeholder="Chercher un document…" value="${esc(state.q)}" aria-label="Chercher un document"></div>
  <div class="chips">${opts.map(([v,l])=>`<button class="chip" data-docsubj="${v}" aria-pressed="${state.docSubj===v}">${l}</button>`).join("")}</div>
  ${groups.map(([c,fs])=>`<section><div class="sec-head"><h2>${CAT_LBL[c]}</h2><span class="status-line">${fs.length}</span></div><div class="files">${fs.map(fileTile).join("")}</div></section>`).join("")||`<div class="empty">Aucun document ne correspond.</div>`}`};

P.bibliotheque=()=>`${head("📕","Codes et textes","Les codes officiels en PDF à jour (codes.droit.org, mis à jour chaque jour à partir de Légifrance), les textes du bloc de constitutionnalité et les articles à connaître.")}
  <section><div class="sec-head"><h2>Textes fondamentaux</h2></div><div class="books">${FUND.map(bookCard).join("")}</div></section>
  <section><div class="sec-head"><h2>Les codes</h2></div><div class="books">${BOOKS.map(bookCard).join("")}</div></section>
  <section><div class="sec-head"><h2>Articles à connaître en constit'</h2></div><div class="arts">${ARTS.dc.map(([a,t])=>`<div class="art" style="--c:var(--c-dc)"><b>${a}</b><span>${esc(t)}</span></div>`).join("")}</div></section>
  <section><div class="sec-head"><h2>Articles à connaître en droit privé</h2></div><div class="arts">${ARTS.idp.map(([a,t])=>`<div class="art" style="--c:var(--c-idp)"><b>${a}</b><span>${esc(t)}</span></div>`).join("")}</div></section>
  <section id="ddhc"><div class="sec-head"><h2>Déclaration des droits de l'homme et du citoyen</h2><span class="status-line">26 août 1789 · texte intégral</span></div>
   <div class="reader"><p class="pre">${esc(DDHC_PRE)}</p>${DDHC.map((a,i)=>`<h3>Article ${i?i+1:"1er"}</h3><p>${esc(a)}</p>`).join("")}</div></section>
  <section><div class="sec-head"><h2>Outils de recherche</h2></div><div class="files">${TOOLS.map(([n,d,u])=>`<a class="file" href="${u}" target="_blank" rel="noopener" style="${vars("lib")}"><span class="pdf">WEB</span><span><b>${esc(n)}</b><small>${esc(d)}</small></span></a>`).join("")}</div></section>`;

function subjCard(k){const s=S[k];const nx=upcoming(i=>i.subj===k&&i.kind!=="todo")[0];const nf=FILES.filter(f=>f[0]===k).length;
  return `<button class="card" data-subj="${k}" style="${vars(k)}"><div class="cv"><span class="ct">${s.ico}</span></div><div class="bd"><h3>${esc(s.n)}</h3><div class="meta"><span>${s.ue}</span><span>coeff. ${s.coef}</span><span>${s.ects} ECTS</span><span>${nf} docs</span></div><div class="nx">${nx?"Prochain : "+esc(nx.title)+" · "+fmtDay(nx.date):ready?"Pas de date à venir":"…"}</div></div></button>`}
P.cours=()=>{
  if(state.subj&&S[state.subj]&&state.subj!=="gen")return subjectPage(state.subj);
  return `${head("📚","Matières du S1",`7 matières, ${SUBJ_ORDER.reduce((a,k)=>a+S[k].ects,0)} ECTS. Ouvre une matière pour voir l'examen, quoi travailler, les dates et tous ses documents.`)}
  <div class="cards">${SUBJ_ORDER.map(subjCard).join("")}</div>`};
function subjectPage(k){
  const s=S[k];const ev=upcoming(i=>i.subj===k&&i.kind!=="todo");const td=items.filter(i=>i.kind==="todo"&&i.subj===k&&!i.done);const fs=FILES.filter(f=>f[0]===k).sort((a,b)=>CAT_ORDER.indexOf(a[2])-CAT_ORDER.indexOf(b[2]));
  const bk=[...FUND,...BOOKS].filter(b=>s.codes.includes(b.k));
  return `${head(s.ico,esc(s.n),"",`<div class="crumb"><button data-go="cours">Matières du S1</button><span>/</span><span>${esc(s.short)}</span></div>`)}
  <dl class="props" style="${vars(k)}"><dt>🎓 Unité</dt><dd>${s.ue} · semestre 1</dd><dt>⚖️ Coefficient</dt><dd>${s.coef} · ${s.ects} ECTS</dd><dt>👤 Enseignants</dt><dd>${esc(s.prof)}</dd><dt>📝 Examen</dt><dd>${esc(s.exam)}</dd></dl>
  <section style="${vars(k)}"><div class="sec-head"><h2>À travailler</h2></div><ul class="plain">${s.work.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>${s.links.map(([t,u])=>`<a class="ext" href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join("")}</section>
  <section><div class="sec-head"><h2>Documents</h2><span class="status-line">${fs.length} PDF</span></div><div class="files">${fs.map(fileTile).join("")}</div></section>
  <section><div class="sec-head"><h2>Prochaines dates</h2></div><div class="panel">${ev.map(eventRow).join("")||loading("Aucune date à venir pour l'instant.")}</div></section>
  ${td.length?`<section><div class="sec-head"><h2>À demander</h2></div><div class="panel">${td.map(todoRow).join("")}</div></section>`:""}
  ${bk.length?`<section><div class="sec-head"><h2>Codes et textes utiles</h2></div><div class="books">${bk.map(bookCard).join("")}</div></section>`:""}`}

function addForm(kind){
  if(state.adding!==kind)return `<button class="ghost-add" data-adding="${kind}">+ ${kind==="devoir"?"Ajouter un devoir":kind==="sortie"?"Ajouter une sortie":"Ajouter un événement"}</button>`;
  return `<form class="add panel" data-addevent="${kind}">
   <input type="text" id="f-title" placeholder="Titre" aria-label="Titre" required>
   ${kind==="event"?`<select id="f-kind" aria-label="Type"><option value="seance">Cours en direct</option><option value="admin">Date limite</option><option value="sortie">Sortie</option></select>`:""}
   ${kind!=="sortie"?`<select id="f-subj" aria-label="Matière">${SUBJ_ORDER.map(k=>`<option value="${k}">${S[k].short}</option>`).join("")}<option value="gen">Admin</option></select>`:""}
   <input type="date" id="f-date" aria-label="Date" required value="${todayISO()}"><input type="time" id="f-start" aria-label="Heure">
   <button class="btn" type="submit">Ajouter</button><button class="btn ghost" type="button" data-adding="">Annuler</button></form>`}

/* ---------- rendu ---------- */
const CV={accueil:["dc","ihd","Licence 1 · semestre 1"],planning:["ri","dc","Planning"],devoirs:["idp","met","Devoirs"],todo:["ang","ri","To-do"],sorties:["out","eco","Sorties"],semaine:["live","met","Semaine type"],cours:["ihd","eco","Matières du S1"],documents:["ihd","dc","Documents"],bibliotheque:["lib","idp","Codes et textes"]};
function render(){
  const pg=P[state.page]?state.page:"accueil";
  let cv=CV[pg]||CV.accueil;if(pg==="cours"&&state.subj&&S[state.subj])cv=[state.subj,state.subj==="dc"?"ri":state.subj==="idp"?"out":state.subj==="ihd"?"eco":state.subj==="met"?"dc":state.subj==="ang"?"ri":state.subj==="ri"?"ang":"ihd",S[state.subj].n];
  const c=$("#cover");c.style.cssText=`--t1:var(--t-${cv[0]});--t2:var(--t-${cv[1]});--a1:var(--a-${cv[0]});--a2:var(--a-${cv[1]});--c1:var(--c-${cv[0]})`;
  if(!c.firstChild)c.innerHTML=`<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="lbl"></span>`;
  c.querySelector(".lbl").textContent=cv[2];
  $("#page").innerHTML=P[pg]();
  document.querySelectorAll(".nav").forEach(b=>{const on=pg==="cours"?(state.subj?b.dataset.subj===state.subj:b.dataset.p==="cours"&&!b.dataset.subj):b.dataset.p===pg;b.setAttribute("aria-current",on?"page":"false")});
  $("#n-devoirs").textContent=ready?items.filter(i=>i.kind==="devoir"&&i.status!=="Rendu").length:"";
  $("#n-todo").textContent=ready?items.filter(i=>i.kind==="todo"&&!i.done).length:"";
  $("#n-planning").textContent=ready?upcoming(i=>i.kind!=="todo"&&daysTo(i.date)<=7).length:"";
  $("#n-docs").textContent=FILES.length;
}
$("#nav-subjects").innerHTML=SUBJ_ORDER.map(k=>`<button class="nav" data-p="cours" data-subj="${k}" style="--a:var(--a-${k})"><span class="dot"></span>${esc(S[k].n)}</button>`).join("");
const go=(p,subj)=>{state.page=p;state.subj=subj||null;state.adding=null;$("#side").classList.remove("open");remember();render();window.scrollTo({top:0})};
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-scroll]");
  if(!t){const s=$("#side");if(s.classList.contains("open")&&!s.contains(e.target))s.classList.remove("open");return}
  if(t.id==="menu"){$("#side").classList.toggle("open");return}
  if(t.dataset.scroll){e.preventDefault();const el=document.getElementById(t.dataset.scroll);el&&el.scrollIntoView({behavior:"smooth"});return}
  if(t.classList.contains("nav"))return go(t.dataset.p,t.dataset.subj);
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.subj&&t.classList.contains("card"))return go("cours",t.dataset.subj);
  if(t.dataset.filter){state.filter=t.dataset.filter;return render()}
  if(t.dataset.docsubj){state.docSubj=t.dataset.docsubj;return render()}
  if(t.hasAttribute("data-past")){state.showPast=!state.showPast;return render()}
  if("adding" in t.dataset){state.adding=t.dataset.adding||null;render();const f=$("#f-title");f&&f.focus();return}
  if(t.dataset.del){if(t.dataset.confirm==="1")return del(t.dataset.del);t.dataset.confirm="1";t.textContent="Supprimer ?";t.style.opacity="1";setTimeout(()=>{if(t.isConnected){t.dataset.confirm="";t.textContent="✕";t.style.opacity=""}},3000)}
});
document.addEventListener("input",e=>{if(e.target.id==="doc-q"){state.q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#doc-q");i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.done)upd(t.dataset.done,{done:t.checked});
  if(t.dataset.status){const v=t.value;t.dataset.v=v;if(t.dataset.kind==="admin")upd(t.dataset.status,{done:v==="Rendu"});else upd(t.dataset.status,{status:v,done:v==="Rendu"})}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
  if(f.dataset.addtodo){const inp=f.querySelector("input");const v=inp.value.trim();if(!v)return;addItem({kind:"todo",group:f.dataset.addtodo,title:v,done:false,order:Date.now(),subj:"gen"});inp.value="";return}
  if(f.dataset.addevent){const k=f.dataset.addevent;const kind=k==="event"?$("#f-kind").value:k;const d={kind,title:$("#f-title").value.trim(),date:$("#f-date").value,start:$("#f-start").value||"",end:"",note:"",subj:kind==="sortie"?"":($("#f-subj")?$("#f-subj").value:"gen"),done:false};if(kind==="devoir")d.status="À faire";if(!d.title||!d.date)return;addItem(d);state.adding=null;render()}});

/* ---------- démarrage ---------- */
rebuild();render();
(()=>{const el=$("#sync");el.classList.add("on");el.querySelector("span").textContent="Enregistré dans ce navigateur"})();
</script>

</body>
</html>
